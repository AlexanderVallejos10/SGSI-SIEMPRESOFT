{% extends "traceability/base.html" %}{% block trace_content %}<h1>{{ title }}</h1><form method="post" class="trace-card trace-form">{% csrf_token %}{{ form.non_field_errors }}{% for field in form %}<div><label for="{{ field.id_for_label }}">{{ field.label }}</label>{{ field }}{{ field.errors }}{% if field.help_text %}<small>{{ field.help_text }}</small>{% endif %}</div>{% endfor %}<button class="primary-btn" type="submit">Guardar</button></form>{% endblock %}
